  pushUndo(getVal()||'');setVal(JSON.stringify(ex,null,2));setStatus(`已載入：${key}`,'ok');
}

// ═══════════════════════════════════════════════════════
// OSM MAP ENGINE (Leaflet + OpenStreetMap)
// ═══════════════════════════════════════════════════════
let _rtMap=null; // active Leaflet map instance

function renderMapWidget(mapCfg, containerId){
  // Lazy-init after DOM ready
  setTimeout(()=>{
    const el=document.getElementById(containerId);
    if(!el)return;
    if(_rtMap){_rtMap.remove();_rtMap=null;}
    const lat=mapCfg.lat||25.033, lng=mapCfg.lng||121.565, zoom=mapCfg.zoom||13;
    _rtMap=L.map(containerId,{zoomControl:true,attributionControl:true}).setView([lat,lng],zoom);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>',maxZoom:19
    }).addTo(_rtMap);
    // Add markers
    (mapCfg.markers||[]).forEach(m=>{
      const mk=L.marker([m.lat,m.lng]).addTo(_rtMap);
      if(m.popup)mk.bindPopup(`<b>${m.label||''}</b><br>${m.popup}`);
      if(m.label&&!m.popup)mk.bindTooltip(m.label,{permanent:true,className:'leaflet-tooltip-small'});
    });
    // Click to add marker
    _rtMap.on('click',e=>{
      const latlng=e.latlng;
      L.marker([latlng.lat,latlng.lng]).addTo(_rtMap)
        .bindPopup(`📍 ${latlng.lat.toFixed(5)}, ${latlng.lng.toFixed(5)}`).openPopup();
    });
  },100);
}

function showMap(lat,lng,zoom,markers){
  lat=lat||25.033;lng=lng||121.565;zoom=zoom||13;
  const cfg={lat,lng,zoom,markers:markers||[]};
  const mid='rt-map-'+Date.now();
  // Inject map container into rt-content
  let extra=document.getElementById('rt-map-extra');
  if(!extra){extra=document.createElement('div');extra.id='rt-map-extra';document.getElementById('rt-content').appendChild(extra);}
  extra.innerHTML=`
    <div class="rt-map-wrap">
      <div class="rt-map-toolbar">
        <input id="map-search-input" placeholder="搜尋地名..." style="flex:1">
        <button onclick="geocodeSearch(document.getElementById('map-search-input').value)">🔍</button>
        <button onclick="locateMe()">📍 定位</button>
        <button onclick="if(_rtMap)_rtMap.zoomIn()">＋</button>
        <button onclick="if(_rtMap)_rtMap.zoomOut()">－</button>
      </div>
      <div id="${mid}" style="height:220px"></div>
    </div>`;
  renderMapWidget(cfg,mid);
}

function addMarker(lat,lng,label,popup){
  if(!_rtMap)return;
  L.marker([lat,lng]).addTo(_rtMap).bindPopup(`<b>${label||''}</b>${popup?'<br>'+popup:''}`).openPopup();
}

function locateMe(){
  if(!navigator.geolocation){alert('瀏覽器不支援定位');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude:lat,longitude:lng}=pos.coords;
    if(_rtMap){
      _rtMap.setView([lat,lng],16);
      L.marker([lat,lng],{
        icon:L.divIcon({className:'',html:'<div style="width:14px;height:14px;border-radius:50%;background:#3b5bdb;border:3px solid #fff;box-shadow:0 0 8px rgba(59,91,219,.5)"></div>',iconAnchor:[7,7]})
      }).addTo(_rtMap).bindPopup('📍 你在這裡！').openPopup();
    }
    setStatus(`✓ 已定位：${lat.toFixed(4)}, ${lng.toFixed(4)}`,'ok');
  },err=>{setStatus('定位失敗：'+err.message,'e');});
}

async function geocodeSearch(query){
  if(!query||!query.trim()){alert('請輸入地名');return;}
  setStatus('搜尋中...','ok');
  try{
    const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`,{headers:{'Accept-Language':'zh-TW'}});
    const data=await res.json();
    if(!data.length){setStatus('找不到「'+query+'」','e');return;}
    const{lat,lon,display_name}=data[0];
    if(_rtMap){
      _rtMap.setView([lat,lon],14);
      L.marker([lat,lon]).addTo(_rtMap).bindPopup(`<b>${query}</b><br><small>${display_name}</small>`).openPopup();
    }
    setStatus('✓ 找到：'+display_name.slice(0,40),'ok');
  }catch(e){setStatus('搜尋失敗','e');}
}

// ═══════════════════════════════════════════════════════
// P2P ROOM ENGINE (PeerJS + WebRTC)
// ═══════════════════════════════════════════════════════
let _peer=null, _localStream=null, _connections=[], _dataConns=[], _roomMode='host';
let _camOn=true, _micOn=true, _myPeerId='', _chatMsgs=[];

function renderRoomWidget(roomCfg){
  const mode=roomCfg.mode||'host';
  const useVideo=roomCfg.video!==false;
  const useAudio=roomCfg.audio!==false;
  const useChat=roomCfg.chat!==false;
  _roomMode=mode;

  let extra=document.getElementById('rt-room-extra');
  if(!extra){extra=document.createElement('div');extra.id='rt-room-extra';document.getElementById('rt-content').appendChild(extra);}

  extra.innerHTML=`
    <div class="rt-room-wrap">
      <div class="rt-room-header">
        <span style="font-size:16px">${useVideo?'📹':'💬'}</span>
        <span class="rh-title">${mode==='host'?'會議室主持人':'加入會議室'}</span>
        <span class="rh-status" id="room-status">離線</span>
      </div>
      <div class="rt-room-body">
        <div class="rt-room-id" id="room-id-display">初始化中...</div>
        <div class="rt-peers" id="room-peers">
          <div class="peer-tile">
            <video id="local-video" class="peer-video local" autoplay muted playsinline style="display:${useVideo?'block':'none'}"></video>
            <div class="peer-label">我 ${useVideo?'📷':'💬'}</div>
          </div>
        </div>
        <div class="rt-room-controls">
          ${mode==='host'?`<button class="room-btn join" onclick="startRoom(${useVideo},${useAudio})">🟢 開始</button>`:`<input id="join-id-input" placeholder="輸入房間 ID..." style="flex:2;padding:8px;border:1px solid #ddd;border-radius:9px;font-size:12px;outline:none"><button class="room-btn join" style="flex:1" onclick="joinRoomById(document.getElementById('join-id-input').value,${useVideo},${useAudio})">加入</button>`}
          ${useAudio?`<button class="room-btn mute" id="btn-mute" onclick="toggleMute()">🎤 靜音</button>`:''}
          ${useVideo?`<button class="room-btn cam" id="btn-cam" onclick="toggleCamera()">📷 關閉</button>`:''}
          <button class="room-btn leave" onclick="leaveRoom()">📴 離開</button>
        </div>
        ${useChat?`
        <div class="room-chat">
          <div class="room-chat-msgs" id="room-chat-msgs"></div>
          <div class="room-chat-input">
            <input id="room-chat-text" placeholder="輸入訊息..." onkeydown="if(event.key==='Enter')sendChat()">
            <button onclick="sendChat()">發送</button>
          </div>
        </div>`:''}
      </div>
    </div>`;
}

async function startRoom(useVideo=true, useAudio=true){
  try{
    if(useVideo||useAudio){
      _localStream=await navigator.mediaDevices.getUserMedia({video:useVideo,audio:useAudio});
      const lv=document.getElementById('local-video');
      if(lv){lv.srcObject=_localStream;}
    }
    _peer=new Peer(undefined,{debug:0});
    _peer.on('open',id=>{
      _myPeerId=id;
      const disp=document.getElementById('room-id-display');
      if(disp)disp.innerHTML=`房間 ID（分享給對方）：<br><b style="color:#4f46e5;font-size:13px;user-select:all">${id}</b> <button onclick="navigator.clipboard.writeText('${id}').then(()=>setStatus('✓ 已複製 ID','ok'))" style="padding:2px 7px;font-size:10px;border-radius:4px;border:1px solid #ddd;cursor:pointer">複製</button>`;
      const st=document.getElementById('room-status');
      if(st){st.textContent='等待中';st.className='rh-status online';}
      setStatus(`✓ 會議室已建立，ID: ${id.slice(0,8)}...`,'ok');
    });
    _peer.on('call',call=>{
      call.answer(_localStream||undefined);
      call.on('stream',remoteStream=>addRemotePeer(call.peer,remoteStream));
      call.on('close',()=>removePeer(call.peer));
      _connections.push(call);
    });
    _peer.on('connection',dc=>{
      _dataConns.push(dc);
      dc.on('data',d=>receiveChat(d,dc.peer));
    });
    _peer.on('error',e=>setStatus('PeerJS 錯誤: '+e.type,'e'));
  }catch(e){
    setStatus('媒體存取失敗：'+e.message,'e');
    alert('無法存取鏡頭/麥克風：\n'+e.message+'\n\n（請允許瀏覽器存取後重試）');
  }
}

async function joinRoomById(hostId, useVideo=true, useAudio=true){
  if(!hostId||!hostId.trim()){alert('請輸入有效的房間 ID');return;}
  hostId=hostId.trim();
  try{
    if(useVideo||useAudio){
      _localStream=await navigator.mediaDevices.getUserMedia({video:useVideo,audio:useAudio});
      const lv=document.getElementById('local-video');
      if(lv){lv.srcObject=_localStream;}
    }
    _peer=new Peer(undefined,{debug:0});
    _peer.on('open',id=>{
      _myPeerId=id;
      setStatus('連接中...','ok');
      // Video call
      if(_localStream){
        const call=_peer.call(hostId,_localStream);
        call.on('stream',remoteStream=>addRemotePeer(hostId,remoteStream));
        call.on('close',()=>removePeer(hostId));
        _connections.push(call);
      }
      // Data channel for chat
      const dc=_peer.connect(hostId);
      dc.on('open',()=>{
        _dataConns.push(dc);
        const st=document.getElementById('room-status');
        if(st){st.textContent='已連接';st.className='rh-status online';}
        const disp=document.getElementById('room-id-display');
        if(disp)disp.innerHTML=`已加入主持人：<b style="color:#4f46e5">${hostId.slice(0,12)}...</b>`;
        setStatus('✓ 已加入會議室','ok');
      });
      dc.on('data',d=>receiveChat(d,hostId));
      dc.on('error',e=>setStatus('連接錯誤','e'));
    });
    _peer.on('error',e=>{setStatus('連接失敗: '+e.type,'e');alert('無法連接到房間 ID: '+hostId+'\n錯誤: '+e.type);});
  }catch(e){
    setStatus('媒體存取失敗：'+e.message,'e');
    alert('無法存取鏡頭/麥克風：\n'+e.message);
  }
}

function addRemotePeer(peerId, stream){
  const peers=document.getElementById('room-peers');if(!peers)return;
  const existing=document.getElementById('peer-'+peerId);
  if(existing){const v=existing.querySelector('video');if(v)v.srcObject=stream;return;}
  const tile=document.createElement('div');tile.className='peer-tile';tile.id='peer-'+peerId;
  tile.innerHTML=`<video class="peer-video" autoplay playsinline style="display:block"></video><div class="peer-label">👤 ${peerId.slice(0,6)}</div>`;
  tile.querySelector('video').srcObject=stream;
  peers.appendChild(tile);
  const st=document.getElementById('room-status');
  if(st){st.textContent=`${document.querySelectorAll('.peer-tile').length}人`;st.className='rh-status online';}
  setStatus('✓ 新成員加入','ok');
}

function removePeer(peerId){
  const el=document.getElementById('peer-'+peerId);if(el)el.remove();
}

function toggleMute(){
  if(!_localStream)return;
  _micOn=!_micOn;
  _localStream.getAudioTracks().forEach(t=>t.enabled=_micOn);
  const btn=document.getElementById('btn-mute');
  if(btn){btn.textContent=_micOn?'🎤 靜音':'🔇 解除';btn.classList.toggle('active',!_micOn);}
}

function toggleCamera(){
  if(!_localStream)return;
  _camOn=!_camOn;
  _localStream.getVideoTracks().forEach(t=>t.enabled=_camOn);
  const btn=document.getElementById('btn-cam');
  if(btn){btn.textContent=_camOn?'📷 關閉':'📷 開啟';btn.classList.toggle('active',!_camOn);}
}

function leaveRoom(){
  _connections.forEach(c=>{try{c.close();}catch{}});
  _dataConns.forEach(c=>{try{c.close();}catch{}});
  _connections=[];_dataConns=[];
  if(_peer){_peer.destroy();_peer=null;}
  if(_localStream){_localStream.getTracks().forEach(t=>t.stop());_localStream=null;}
  const st=document.getElementById('room-status');
  if(st){st.textContent='已離開';st.className='rh-status';}
  const disp=document.getElementById('room-id-display');
  if(disp)disp.textContent='已離開會議室';
  setStatus('已離開會議室','ok');
}

function sendChat(){
  const input=document.getElementById('room-chat-text');if(!input)return;
  const msg=input.value.trim();if(!msg)return;
  input.value='';
  const name='我';
  appendChatMsg(name,msg);
  _dataConns.forEach(dc=>{try{dc.send({name:_myPeerId.slice(0,6),msg});}catch{}});
}

function receiveChat(data,peerId){
  if(typeof data==='string')appendChatMsg(peerId.slice(0,6),data);
  else if(data&&data.msg)appendChatMsg(data.name||peerId.slice(0,6),data.msg);
}

function appendChatMsg(name,msg){
  const box=document.getElementById('room-chat-msgs');if(!box)return;
  const div=document.createElement('div');div.className='room-chat-msg';
  div.innerHTML=`<span class="msg-name">${name}：</span>${msg}`;
  box.appendChild(div);box.scrollTop=box.scrollHeight;
}

init();
</script>
