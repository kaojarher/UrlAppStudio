<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>URL App Studio v2 | Audio + Map + P2P</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<style>
:root {
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2128;--border:#30363d;
  --accent:#58a6ff;--accent2:#3fb950;--warn:#d29922;--err:#f85149;
  --text:#c9d1d9;--text-dim:#6e7681;--text-bright:#e6edf3;
  --tok-key:#79c0ff;--tok-str:#a5d6ff;--tok-num:#f2cc60;--tok-bool:#ff7b72;--tok-punct:#8b949e;
  --audio:#a78bfa;--tts:#34d399;--stt:#fb923c;
  --toolbar-h:52px;--bottombar-h:60px;--statusbar-h:20px;--sidebar-w:220px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
button{cursor:pointer;font-family:inherit}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* TOOLBAR */
#toolbar{position:fixed;top:0;left:0;right:0;height:var(--toolbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 10px;gap:6px;z-index:300}
.logo{font-weight:800;font-size:14px;color:var(--text-bright);white-space:nowrap}
.logo em{color:var(--accent);font-style:normal}.logo small{font-size:10px;opacity:.4;font-weight:400}
.tb-sep{width:1px;height:20px;background:var(--border);flex-shrink:0}.tb-spacer{flex:1}
.tb-btn{padding:6px 10px;border-radius:7px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;font-weight:600;white-space:nowrap;transition:all .15s;flex-shrink:0}
.tb-btn:hover{background:var(--border);color:var(--text-bright)}.tb-btn:active{transform:scale(.96)}.tb-btn:disabled{opacity:.3;cursor:default}
.tb-btn.primary{background:var(--accent);color:#0d1117;border-color:var(--accent)}.tb-btn.success{background:var(--accent2);color:#0d1117;border-color:var(--accent2)}
.tb-btn.primary:hover,.tb-btn.success:hover{filter:brightness(1.1)}.tb-label{display:inline}
#ham-btn{display:none;width:40px;height:40px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:18px;flex-shrink:0;align-items:center;justify-content:center}

/* AUDIO STATUS BAR (below toolbar) */
#audio-bar{
  position:fixed;top:var(--toolbar-h);left:0;right:0;height:32px;
  background:linear-gradient(90deg,rgba(167,139,250,.12),rgba(52,211,153,.08));
  border-bottom:1px solid rgba(167,139,250,.25);
  display:none;align-items:center;padding:0 12px;gap:10px;z-index:290;font-size:11px;
}
#audio-bar.visible{display:flex}
.ab-item{display:flex;align-items:center;gap:5px;color:var(--text-dim)}
.ab-dot{width:6px;height:6px;border-radius:50%;background:var(--audio);animation:pulse 1.2s infinite}
.ab-dot.tts{background:var(--tts)}.ab-dot.stt{background:var(--stt);animation:pulse .6s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.ab-stop{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:4px;padding:2px 7px;font-size:10px;margin-left:4px}
.ab-stop:hover{border-color:var(--err);color:var(--err)}
.ab-viz{display:flex;align-items:center;gap:2px;height:16px}
.ab-viz-bar{width:3px;background:var(--audio);border-radius:2px;animation:viz .4s ease infinite alternate}
.ab-viz-bar:nth-child(2){animation-delay:.1s;animation-duration:.3s}
.ab-viz-bar:nth-child(3){animation-delay:.2s;animation-duration:.5s}
.ab-viz-bar:nth-child(4){animation-delay:.05s;animation-duration:.35s}
.ab-viz-bar:nth-child(5){animation-delay:.15s;animation-duration:.45s}
@keyframes viz{from{height:3px}to{height:14px}}
#ab-spacer{flex:1}
#ab-vol-wrap{display:flex;align-items:center;gap:6px}
#ab-vol-wrap label{font-size:10px;color:var(--text-dim)}
#ab-volume{width:70px;accent-color:var(--audio)}

/* LAYOUT */
#app{
  position:fixed;left:0;right:0;
  top:var(--toolbar-h);
  bottom:var(--statusbar-h);
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr 300px;
  grid-template-rows:1fr 140px;
}
#app.audio-bar-on{top:calc(var(--toolbar-h) + 32px)}

/* SIDEBAR */
#sidebar{grid-row:1/3;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;transition:transform .25s cubic-bezier(.4,0,.2,1);z-index:200}
.sidebar-hdr{padding:10px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.sidebar-hdr-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim)}
.sidebar-hdr-btn{width:30px;height:30px;border-radius:6px;border:none;background:rgba(88,166,255,.15);color:var(--accent);font-size:20px;display:flex;align-items:center;justify-content:center}
#scene-list{flex:1;overflow-y:auto;padding:6px}
.scene-item{padding:10px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;border:1px solid transparent;transition:background .1s;min-height:44px}
.scene-item:hover{background:var(--surface2)}.scene-item.active{background:rgba(88,166,255,.12);border-color:rgba(88,166,255,.3);color:var(--accent)}
.scene-del{opacity:0;width:28px;height:28px;border-radius:5px;background:none;border:1px solid var(--err);color:var(--err);font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.scene-item:hover .scene-del{opacity:1}
.scene-badge{font-size:10px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:1px 5px;color:var(--text-dim)}
.scene-item.active .scene-badge{background:rgba(88,166,255,.15);border-color:rgba(88,166,255,.3);color:var(--accent)}
.sidebar-section{border-top:1px solid var(--border);padding:8px 10px}
.sidebar-section-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:6px}
.example-btn{display:flex;align-items:center;width:100%;text-align:left;padding:9px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:12px;margin-bottom:4px;min-height:40px;transition:background .1s}
.example-btn:hover{background:var(--border);color:var(--text-bright)}.example-btn:active{transform:scale(.98)}
#drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:190;opacity:0;transition:opacity .25s}

/* EDITOR */
#editor-area{grid-column:2;grid-row:1;display:flex;flex-direction:column;overflow:hidden}
#editor-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 8px;flex-shrink:0}
.etab{padding:10px 14px;font-size:12px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap;min-height:44px;display:flex;align-items:center}
.etab:hover{color:var(--text)}.etab.active{color:var(--accent);border-bottom-color:var(--accent)}
#editor-panels{flex:1;overflow:hidden;position:relative}
.hl-wrap{position:relative;height:100%;font-family:'Cascadia Code','Fira Code','Consolas',monospace;font-size:13px;line-height:1.65;background:var(--bg)}
.hl-lines{position:absolute;left:0;top:0;bottom:0;width:44px;background:var(--surface);border-right:1px solid var(--border);overflow:hidden;text-align:right;padding:14px 6px 14px 0;color:var(--text-dim);font-size:11px;line-height:1.65;user-select:none;z-index:2}
.hl-display{position:absolute;left:44px;top:0;right:0;bottom:0;padding:14px 12px;overflow:auto;pointer-events:none;white-space:pre;z-index:1;color:var(--tok-punct)}
.raw-ed{position:absolute;left:44px;top:0;right:0;bottom:0;padding:14px 12px;background:transparent;color:transparent;caret-color:var(--text-bright);border:none;outline:none;resize:none;font-family:inherit;font-size:inherit;line-height:inherit;white-space:pre;overflow:auto;z-index:3}
.raw-ed::selection{background:rgba(88,166,255,.25)}
#panel-visual{height:100%;overflow-y:auto;background:var(--bg);display:none}
.vpanel-inner{padding:16px;max-width:560px;margin:0 auto}
.vfield{margin-bottom:14px}
.vfield label{display:block;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:5px}
.vfield input,.vfield textarea,.vfield select{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:7px;color:var(--text-bright);font-size:13px;outline:none;transition:border-color .15s;-webkit-appearance:none;min-height:44px}
.vfield input:focus,.vfield textarea:focus{border-color:var(--accent)}.vfield textarea{font-family:inherit;resize:vertical;min-height:80px}
.vfield-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vsection-title{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin:16px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--border)}
.vbtn-item{background:var(--surface2);border:1px solid var(--border);border-radius:7px;padding:10px;margin-bottom:8px}
.vbtn-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end;margin-bottom:6px}
.vbtn-item input,.vbtn-item select{padding:8px 10px;font-size:12px;min-height:40px}
.vbtn-del{width:36px;height:40px;border-radius:6px;background:none;border:1px solid var(--err);color:var(--err);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.vadd-btn{background:none;border:1px dashed var(--border);color:var(--text-dim);border-radius:7px;padding:10px;width:100%;font-size:12px;transition:all .15s;min-height:44px}
.vadd-btn:hover{border-color:var(--accent);color:var(--accent)}
.vapply{width:100%;margin-top:14px;padding:12px;background:var(--accent);color:#0d1117;border:none;border-radius:8px;font-size:14px;font-weight:700;min-height:48px}
/* Audio quick-insert chips */
.audio-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chip{padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;border:none;cursor:pointer;transition:all .15s}
.chip.bgm{background:rgba(167,139,250,.15);color:var(--audio);border:1px solid rgba(167,139,250,.3)}
.chip.sfx{background:rgba(167,139,250,.1);color:var(--audio);border:1px solid rgba(167,139,250,.2)}
.chip.beep{background:rgba(52,211,153,.1);color:var(--tts);border:1px solid rgba(52,211,153,.2)}
.chip.tts{background:rgba(52,211,153,.15);color:var(--tts);border:1px solid rgba(52,211,153,.3)}
.chip.stt{background:rgba(251,146,60,.15);color:var(--stt);border:1px solid rgba(251,146,60,.3)}
.chip:hover{filter:brightness(1.2)}
#url-strip{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--surface2);border-top:1px solid var(--border);flex-shrink:0}
#url-strip span{font-size:10px;color:var(--text-dim);white-space:nowrap}
#url-output{flex:1;font-family:monospace;font-size:10px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* PREVIEW */
#preview-area{grid-column:3;grid-row:1/3;background:var(--surface2);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#preview-header{padding:8px 12px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
#preview-header-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim)}
.pv-sel{background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:11px;border-radius:4px;padding:4px 6px;outline:none;min-height:32px}
#preview-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:16px 10px}
.phone-frame{width:240px;background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 16px 50px rgba(0,0,0,.6);border:3px solid #2d2d2d;flex-shrink:0}
.phone-notch{background:#1a1a1a;height:28px;display:flex;align-items:center;justify-content:center;border-radius:0 0 12px 12px;margin:0 24px 2px}
.phone-notch-pill{width:50px;height:4px;background:#333;border-radius:2px}
.pv-titlebar{background:#111;color:#fff;text-align:center;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:7px}
.pv-body{padding:16px 14px;min-height:260px}
.pv-head{font-size:16px;font-weight:900;color:#1a1a1a;margin-bottom:5px;line-height:1.2}
.pv-desc{font-size:11px;color:#666;line-height:1.5;margin-bottom:14px;white-space:pre-line}
.pv-field-label{font-size:8px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#999;margin-bottom:3px}
.pv-field-input{width:100%;padding:8px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:8px;font-size:11px;color:#aaa;margin-bottom:8px}
.pv-btn{width:100%;padding:10px;color:#fff;border:none;border-radius:12px;font-size:11px;font-weight:700;margin-bottom:6px;text-align:center;display:block}
/* preview audio badge */
.pv-audio-tag{display:inline-block;font-size:9px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:4px;vertical-align:middle}
.pv-audio-tag.bgm{background:#ede9fe;color:#7c3aed}
.pv-audio-tag.sfx{background:#ede9fe;color:#6d28d9}
.pv-audio-tag.beep{background:#d1fae5;color:#065f46}
.pv-audio-tag.tts{background:#d1fae5;color:#047857}
.pv-audio-tag.stt{background:#ffedd5;color:#c2410c}

/* DIAGNOSTICS */
#diag-panel{grid-column:2;grid-row:2;background:var(--surface);border-top:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#diag-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--surface2);padding:0 6px;flex-shrink:0}
.dtab{padding:6px 12px;font-size:11px;font-weight:600;color:var(--text-dim);border-bottom:2px solid transparent;transition:all .15s;min-height:36px;display:flex;align-items:center;gap:4px}
.dtab:hover{color:var(--text)}.dtab.active{color:var(--text-bright);border-bottom-color:var(--accent)}
.badge{min-width:16px;height:16px;background:var(--err);color:#fff;border-radius:8px;font-size:10px;font-weight:700;text-align:center;line-height:16px;padding:0 4px}
.badge.w{background:var(--warn)}.badge.ok{background:var(--accent2)}
#diag-body{flex:1;overflow-y:auto;padding:4px 6px}
.diag-item{display:flex;align-items:flex-start;gap:7px;padding:6px;border-radius:5px;margin-bottom:2px;cursor:pointer;transition:background .1s;min-height:36px}
.diag-item:hover{background:var(--surface2)}.diag-icon{font-size:13px;flex-shrink:0;margin-top:2px}
.diag-msg{flex:1;font-size:12px;line-height:1.4}.diag-loc{color:var(--text-dim);font-size:10px;font-family:monospace}
.diag-empty{color:var(--text-dim);font-size:12px;padding:12px 6px}
/* Syntax reference panel */
#ref-panel{grid-column:2;grid-row:2;background:var(--surface);border-top:1px solid var(--border);display:none;flex-direction:column;overflow:hidden}
#ref-body{flex:1;overflow-y:auto;padding:8px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ref-card{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.ref-card h4{font-size:10px;font-weight:700;letter-spacing:.5px;margin-bottom:4px}
.ref-card h4.audio{color:var(--audio)}.ref-card h4.tts{color:var(--tts)}.ref-card h4.stt{color:var(--stt)}.ref-card h4.nav{color:var(--accent)}
.ref-card code{display:block;font-family:monospace;font-size:10px;color:var(--tok-str);margin-bottom:2px;line-height:1.5}
.ref-card p{font-size:10px;color:var(--text-dim);line-height:1.4}

/* STATUS */
#statusbar{position:fixed;bottom:0;left:0;right:0;height:var(--statusbar-h);background:var(--accent);display:flex;align-items:center;padding:0 10px;gap:12px;z-index:300;font-size:11px;color:#0d1117;font-weight:600}
#statusbar.e{background:var(--err);color:#fff}#statusbar.w{background:var(--warn);color:#0d1117}
#status-msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* BOTTOM TABS (mobile) */
#bottom-bar{position:fixed;bottom:0;left:0;right:0;height:calc(var(--bottombar-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);display:none;z-index:300}
.bottom-tabs{display:flex;height:100%}
.btab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--text-dim);font-size:10px;font-weight:600;transition:color .15s;padding:4px}
.btab .btab-icon{font-size:20px;line-height:1}.btab.active{color:var(--accent)}.btab:active{opacity:.7}

/* MOBILE PANELS */
#mobile-panels{display:none;position:absolute;top:var(--toolbar-h);left:0;right:0;bottom:calc(var(--statusbar-h)+var(--bottombar-h)+var(--safe-bottom))}
#mobile-panels.audio-bar-on{top:calc(var(--toolbar-h) + 32px)}
.mpanel{display:none;position:absolute;inset:0;overflow:hidden;flex-direction:column}
.mpanel.active{display:flex}

/* RUNTIME */
#runtime-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;padding:16px}
#runtime-overlay.show{display:flex}
.rt-close{position:absolute;top:16px;right:16px;background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;min-height:44px}
.rt-phone{width:min(320px,100%);background:#fff;border-radius:36px;overflow:hidden;box-shadow:0 24px 80px rgba(0,0,0,.8);border:5px solid #1a1a1a;max-height:calc(100vh - 80px);overflow-y:auto}
#rt-title{background:#111;color:#fff;text-align:center;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:10px;position:sticky;top:0}
#rt-content{padding:24px 18px;min-height:360px}
/* Runtime audio bar */
#rt-audio-bar{display:none;background:#111;padding:8px 16px;align-items:center;gap:8px;position:sticky;top:28px;z-index:10}
#rt-audio-bar.visible{display:flex}
.rt-ab-item{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700}
.rt-ab-dot{width:5px;height:5px;border-radius:50%;animation:pulse 1s infinite}
/* STT button in runtime */
.stt-btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:8px 14px;border-radius:10px;border:2px solid var(--stt);
  background:rgba(251,146,60,.1);color:#c2410c;font-size:12px;font-weight:700;
  margin-top:4px;transition:all .2s;
}
.stt-btn.listening{background:#fed7aa;border-color:#ea580c;animation:stt-pulse .6s infinite alternate}
@keyframes stt-pulse{from{box-shadow:0 0 0 0 rgba(251,146,60,.4)}to{box-shadow:0 0 0 8px rgba(251,146,60,0)}}
.stt-result{font-size:11px;color:#666;margin-top:4px;min-height:16px;font-style:italic}

/* MAP WIDGET */
.rt-map-wrap{border-radius:14px;overflow:hidden;margin:12px 0;border:2px solid #e5e5e5;position:relative}
.rt-map-toolbar{display:flex;align-items:center;gap:6px;padding:7px 10px;background:#f8f8f8;border-bottom:1px solid #e5e5e5;flex-wrap:wrap}
.rt-map-toolbar button{padding:4px 10px;border-radius:7px;border:1px solid #ddd;background:#fff;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s}
.rt-map-toolbar button:hover{background:#3b5bdb;color:#fff;border-color:#3b5bdb}
.rt-map-toolbar input{flex:1;min-width:120px;padding:4px 8px;border:1px solid #ddd;border-radius:7px;font-size:11px;outline:none}
.leaflet-container{background:#e8f4f0}
/* P2P ROOM WIDGET */
.rt-room-wrap{border-radius:14px;overflow:hidden;margin:12px 0;border:2px solid #e5e5e5;background:#f9f9f9}
.rt-room-header{padding:10px 14px;background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;display:flex;align-items:center;gap:8px}
.rt-room-header .rh-title{font-size:12px;font-weight:800;flex:1}
.rt-room-header .rh-status{font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.15)}
.rt-room-header .rh-status.online{background:rgba(52,211,153,.3);color:#6ee7b7}
.rt-room-body{padding:12px 14px}
.rt-room-id{font-size:10px;font-family:monospace;color:#666;margin-bottom:10px;word-break:break-all;background:#f0f0f0;padding:5px 8px;border-radius:6px}
.rt-peers{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;min-height:30px}
.peer-tile{width:72px;text-align:center}
.peer-video{width:72px;height:54px;border-radius:8px;background:#1a1a1a;object-fit:cover;border:2px solid #4f46e5}
.peer-video.local{border-color:#059669}
.peer-label{font-size:9px;color:#666;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-room-controls{display:flex;gap:6px;flex-wrap:wrap}
.room-btn{flex:1;min-width:60px;padding:8px 6px;border-radius:9px;border:none;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px}
.room-btn.join{background:#4f46e5;color:#fff}.room-btn.join:hover{background:#4338ca}
.room-btn.leave{background:#ef4444;color:#fff}.room-btn.leave:hover{background:#dc2626}
.room-btn.mute{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}.room-btn.mute.active{background:#fef3c7;color:#92400e;border-color:#fbbf24}
.room-btn.cam{background:#f3f4f6;color:#374151;border:1px solid #d1d5db}.room-btn.cam.active{background:#dbeafe;color:#1e40af;border-color:#60a5fa}
.room-chat{margin-top:10px;border-top:1px solid #e5e5e5;padding-top:8px}
.room-chat-msgs{max-height:80px;overflow-y:auto;font-size:11px;color:#374151;margin-bottom:6px;line-height:1.5}
.room-chat-msg{padding:2px 0}
.room-chat-msg .msg-name{font-weight:700;color:#4f46e5}
.room-chat-input{display:flex;gap:5px}
.room-chat-input input{flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:7px;font-size:11px;outline:none}
.room-chat-input button{padding:6px 12px;background:#4f46e5;color:#fff;border:none;border-radius:7px;font-size:11px;font-weight:700;cursor:pointer}
/* Chips for map/room */
.chip.map{background:rgba(16,185,129,.1);color:#059669;border:1px solid rgba(16,185,129,.3)}
.chip.room{background:rgba(79,70,229,.1);color:#4f46e5;border:1px solid rgba(79,70,229,.3)}

/* RESPONSIVE */
@media(max-width:1024px){
  :root{--sidebar-w:200px}
  #app{grid-template-columns:var(--sidebar-w) 1fr;grid-template-rows:1fr 130px}
  #preview-area{display:none}
  #ham-btn{display:flex}
  .tb-label{display:none}
}

/* ── MOBILE ≤600px ── */
@media(max-width:600px){
  :root{
    --toolbar-h:52px;
    --bottombar-h:64px;
    --statusbar-h:0px; /* hidden on mobile */
  }
  /* Hide desktop layout */
  #app{display:none}
  #statusbar{display:none}

  /* Sidebar becomes full-width drawer */
  #sidebar{
    display:flex!important;
    position:fixed;
    top:var(--toolbar-h);
    bottom:var(--bottombar-h);
    left:0;width:88%;max-width:320px;
    transform:translateX(-110%);z-index:400;
    border-right:1px solid var(--border);
    box-shadow:4px 0 24px rgba(0,0,0,.5);
  }
  #sidebar.audio-bar-on{top:calc(var(--toolbar-h)+32px)}
  #sidebar.open{transform:translateX(0)}
  #sidebar .scene-item{min-height:52px;font-size:14px;padding:12px}
  #sidebar .scene-del{opacity:1;width:36px;height:36px}
  #sidebar .example-btn{min-height:48px;font-size:13px}

  #drawer-overlay{display:block}
  #ham-btn{display:flex}
  #bottom-bar{display:block}
  #mobile-panels{display:block}

  /* Toolbar - larger touch targets */
  #toolbar{padding:0 12px;gap:8px}
  .logo small{display:none}
  .tb-sep{display:none}
  #btn-fmt,#btn-min,#btn-undo,#btn-redo,#undo-count{display:none}
  .tb-btn{min-height:40px;padding:8px 12px;font-size:13px}
  .tb-btn.primary,.tb-btn.success{padding:8px 14px}

  /* Bottom tab bar - taller, larger icons */
  #bottom-bar{
    height:calc(var(--bottombar-h) + var(--safe-bottom));
    padding-bottom:var(--safe-bottom);
  }
  .btab{gap:4px}
  .btab .btab-icon{font-size:22px}
  .btab{font-size:11px;font-weight:700}

  /* Mobile panels fill screen */
  #mobile-panels{
    position:fixed;
    top:var(--toolbar-h);
    left:0;right:0;
    bottom:var(--bottombar-h);
  }
  #mobile-panels.audio-bar-on{top:calc(var(--toolbar-h)+32px)}

  /* MOBILE EDITOR: card-style visual by default */
  #M-etab-code{order:2}
  #M-etab-visual{order:1}
  #M-etab-ref{order:3}

  /* Bigger form inputs for touch */
  .mpanel .vfield input,
  .mpanel .vfield textarea,
  .mpanel .vfield select{
    font-size:16px; /* prevents iOS zoom */
    min-height:52px;
    padding:12px 14px;
  }
  .mpanel .vfield label{font-size:11px;margin-bottom:6px}
  .mpanel .vadd-btn{min-height:52px;font-size:14px}
  .mpanel .vapply{min-height:56px;font-size:15px;border-radius:14px}
  .mpanel .vbtn-item{padding:14px}
  .mpanel .vbtn-row{grid-template-columns:1fr auto;gap:8px}
  .mpanel .vbtn-row .vfield:first-child{grid-column:1}
  .mpanel .vbtn-row .vfield:nth-child(2){grid-column:1;margin-top:0}
  .mpanel .vbtn-del{width:44px;height:44px;font-size:18px}

  /* Audio chips - bigger on mobile */
  .mpanel .audio-chips{gap:7px;padding:4px 0}
  .mpanel .chip{padding:6px 12px;font-size:11px;min-height:36px}

  /* URL strip */
  #M-url-output{font-size:11px}

  /* Ref cards - single column */
  .ref-card{margin-bottom:12px}

  /* RUNTIME: true full-screen on mobile */
  #runtime-overlay{
    padding:0;
    align-items:stretch;
    justify-content:stretch;
    background:#fff;
  }
  .rt-close{
    position:fixed;
    top:0;right:0;
    height:52px;width:52px;
    border-radius:0 0 0 14px;
    border:none;border-bottom:1px solid #e5e5e5;border-left:1px solid #e5e5e5;
    background:#fff;color:#111;
    font-size:18px;font-weight:900;padding:0;
    z-index:10;display:flex;align-items:center;justify-content:center;
  }
  .rt-phone{
    width:100%;border-radius:0;border:none;
    box-shadow:none;max-height:100vh;overflow-y:auto;
    padding-bottom:env(safe-area-inset-bottom,16px);
  }
  #rt-title{
    position:sticky;top:0;z-index:5;
    font-size:11px;padding:14px 60px 14px 16px;
    text-align:left;letter-spacing:1px;
  }
  #rt-content{padding:20px 20px 32px}
  #rt-content h2{font-size:26px;margin-bottom:10px}
  #rt-content p{font-size:15px;line-height:1.7;margin-bottom:20px}

  /* Runtime inputs - large touch targets */
  #rt-content input{
    font-size:16px!important;
    padding:14px 16px!important;
    border-radius:14px!important;
    min-height:52px;
  }
  /* Runtime buttons - large touch targets */
  #rt-content button[onclick*="rtClick"],
  #rt-content button[data-to],
  button.rt-btn-action{
    min-height:58px!important;
    font-size:16px!important;
    border-radius:18px!important;
    padding:16px!important;
    margin-bottom:12px!important;
  }

  /* Map widget full-width on mobile */
  .rt-map-wrap{border-radius:0;margin:0 -20px;border-left:none;border-right:none}
  .rt-map-toolbar{padding:10px 14px}
  .rt-map-toolbar button{min-height:40px;font-size:12px;padding:6px 12px}
  .rt-map-toolbar input{font-size:16px;min-height:40px;padding:8px 12px}

  /* Room widget full-width */
  .rt-room-wrap{border-radius:0;margin:0 -20px;border-left:none;border-right:none}
  .rt-room-body{padding:16px 18px}
  .room-btn{min-height:48px;font-size:13px;padding:12px 8px}
  .peer-video{width:85px;height:64px}
  .peer-tile{width:85px}
  .room-chat-input input{font-size:16px;min-height:48px;padding:12px}
  .room-chat-input button{min-height:48px;padding:12px 16px;font-size:13px}
  .room-chat-msgs{max-height:120px;font-size:13px}
  #join-id-input{font-size:16px!important;min-height:48px;padding:12px!important}

  /* Audio bar on mobile */
  #audio-bar{font-size:12px;padding:0 14px;gap:10px}
  .ab-stop{min-height:28px;padding:4px 10px}
}

/* ── Very small ≤360px ── */
@media(max-width:360px){
  :root{--bottombar-h:60px;--toolbar-h:48px}
  .btab .btab-icon{font-size:20px}
  .btab{font-size:10px}
  .logo{font-size:12px}
  #rt-content{padding:16px 16px 28px}
  #rt-content h2{font-size:22px}
}

@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.scene-item,.diag-item{animation:fadein .15s ease}

/* Runtime button universal selector (for dynamically generated buttons) */
.rt-action-btn{
  width:100%;padding:16px;background:#111;color:#fff;
  border:none;border-radius:18px;font-size:15px;font-weight:700;
  margin-bottom:12px;cursor:pointer;min-height:56px;
  transition:background .15s;text-align:center;display:block;
  -webkit-tap-highlight-color:transparent;
}
.rt-action-btn:hover,.rt-action-btn:active{background:#3b5bdb}

/* Swipe hint animation for mobile editor */
@keyframes swipe-hint{
  0%{transform:translateX(0)}40%{transform:translateX(-8px)}60%{transform:translateX(4px)}100%{transform:translateX(0)}
}
</style>
</head>
<body>

<!-- TOOLBAR -->
<div id="toolbar">
  <button id="ham-btn" onclick="toggleDrawer()">☰</button>
  <div class="logo">URL App <em>Studio</em> <small>v2 🎵</small></div>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-undo" onclick="undo()" disabled>↩</button>
  <button class="tb-btn" id="btn-redo" onclick="redo()" disabled>↪</button>
  <span id="undo-count" style="font-size:10px;color:var(--text-dim)"></span>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-fmt" onclick="formatJSON()">⌗ <span class="tb-label">格式化</span></button>
  <button class="tb-btn" id="btn-min" onclick="minifyJSON()">⊟ <span class="tb-label">壓縮</span></button>
  <div class="tb-spacer"></div>
  <button class="tb-btn primary" onclick="generateAndCopy()">⚡ <span class="tb-label">複製 URL</span></button>
  <button class="tb-btn success" onclick="openRuntime()">▶ <span class="tb-label">運行</span></button>
</div>

<!-- AUDIO STATUS BAR -->
<div id="audio-bar">
  <span id="ab-bgm-item" class="ab-item" style="display:none">
    <div class="ab-viz"><div class="ab-viz-bar"></div><div class="ab-viz-bar"></div><div class="ab-viz-bar"></div><div class="ab-viz-bar"></div><div class="ab-viz-bar"></div></div>
    <span style="color:var(--audio);font-weight:700">BGM</span>
    <button class="ab-stop" onclick="stopBGM()">■ 停止</button>
  </span>
  <span id="ab-tts-item" class="ab-item" style="display:none">
    <div class="ab-dot tts"></div>
    <span style="color:var(--tts);font-weight:700">TTS 朗讀中</span>
    <button class="ab-stop" onclick="stopTTS()">■ 停止</button>
  </span>
  <span id="ab-stt-item" class="ab-item" style="display:none">
    <div class="ab-dot stt"></div>
    <span style="color:var(--stt);font-weight:700">🎤 收音中</span>
  </span>
  <span id="ab-spacer"></span>
  <div id="ab-vol-wrap">
    <label>音量</label>
    <input type="range" id="ab-volume" min="0" max="1" step="0.05" value="0.7" oninput="setGlobalVolume(this.value)">
  </div>
</div>

<div id="drawer-overlay" onclick="closeDrawer()"></div>

<!-- SIDEBAR -->
<div id="sidebar">
  <div class="sidebar-hdr">
    <span class="sidebar-hdr-label">場景列表</span>
    <button class="sidebar-hdr-btn" onclick="addScene()">＋</button>
  </div>
  <div id="scene-list"></div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">載入範例</div>
    <button class="example-btn" onclick="loadExample('adventure');closeDrawer()">⚔️ 冒險遊戲</button>
    <button class="example-btn" onclick="loadExample('audio_demo');closeDrawer()">🎵 音訊展示</button>
    <button class="example-btn" onclick="loadExample('map_demo');closeDrawer()">🗺️ 地圖展示</button>
    <button class="example-btn" onclick="loadExample('room_demo');closeDrawer()">📹 P2P 會議室</button>
    <button class="example-btn" onclick="loadExample('survey');closeDrawer()">📋 問卷表單</button>
    <button class="example-btn" onclick="loadExample('tools');closeDrawer()">🛠️ 工具</button>
  </div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div id="editor-area">
    <div id="editor-tabs">
      <div class="etab active" id="etab-code" onclick="switchETab('code')">📄 JSON 源碼</div>
      <div class="etab" id="etab-visual" onclick="switchETab('visual')">✨ 場景編輯器</div>
      <div class="etab" id="etab-ref" onclick="switchETab('ref')">📖 語法手冊</div>
    </div>
    <div id="editor-panels">
      <div id="panel-code" style="height:100%">
        <div class="hl-wrap">
          <div class="hl-lines" id="D-lnums"></div>
          <div class="hl-display" id="D-hldisplay"></div>
          <textarea id="D-editor" class="raw-ed" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
        </div>
      </div>
      <div id="panel-visual"><div class="vpanel-inner" id="D-vpanel"></div></div>
      <div id="panel-ref" style="display:none;height:100%;overflow-y:auto;background:var(--bg)">
        <div style="padding:16px" id="ref-content"></div>
      </div>
    </div>
    <div id="url-strip">
      <span>URL：</span>
      <div id="url-output">尚未生成...</div>
      <button class="tb-btn" onclick="copyURL()" style="padding:5px 10px;font-size:11px">複製</button>
    </div>
  </div>

  <div id="preview-area">
    <div id="preview-header">
      <span id="preview-header-label">📱 即時預覽</span>
      <select id="D-pvsel" class="pv-sel" onchange="renderPreview()"></select>
    </div>
    <div id="preview-body">
      <div class="phone-frame">
        <div class="phone-notch"><div class="phone-notch-pill"></div></div>
        <div class="pv-titlebar" id="D-pvtitle">App</div>
        <div class="pv-body">
          <div class="pv-head" id="D-pvhead"></div>
          <div class="pv-desc" id="D-pvdesc"></div>
          <div id="D-pvfields"></div>
          <div id="D-pvbtns"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="diag-panel">
    <div id="diag-tabs">
      <div class="dtab active" id="D-dtab-err" onclick="switchDTab('err')">錯誤 <span class="badge" id="D-err-badge">0</span></div>
      <div class="dtab" id="D-dtab-warn" onclick="switchDTab('warn')">警告 <span class="badge w" id="D-warn-badge">0</span></div>
      <div class="dtab" id="D-dtab-info" onclick="switchDTab('info')">資訊 <span class="badge ok" id="D-info-badge">0</span></div>
    </div>
    <div id="diag-body"></div>
  </div>
</div>

<!-- MOBILE PANELS -->
<div id="mobile-panels">

  <!-- EDITOR PANEL: Visual-first on mobile -->
  <div class="mpanel active" id="mp-editor">
    <div style="display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 6px;flex-shrink:0;overflow-x:auto">
      <div class="etab active" id="M-etab-visual" onclick="switchMETab('visual')">✨ 編輯場景</div>
      <div class="etab" id="M-etab-code" onclick="switchMETab('code')">📄 JSON</div>
      <div class="etab" id="M-etab-ref" onclick="switchMETab('ref')">📖 手冊</div>
    </div>
    <div style="flex:1;overflow:hidden;position:relative">
      <!-- Visual panel shown first on mobile -->
      <div id="M-panel-visual" style="height:100%;overflow-y:auto;background:var(--bg)">
        <div class="vpanel-inner" id="M-vpanel" style="padding:16px;max-width:100%"></div>
      </div>
      <!-- JSON panel -->
      <div id="M-panel-code" style="display:none;height:100%">
        <div class="hl-wrap">
          <div class="hl-lines" id="M-lnums"></div>
          <div class="hl-display" id="M-hldisplay"></div>
          <textarea id="M-editor" class="raw-ed" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" style="font-size:13px"></textarea>
        </div>
      </div>
      <!-- Ref panel -->
      <div id="M-panel-ref" style="display:none;height:100%;overflow-y:auto;background:var(--bg);padding:14px">
        <div id="M-ref-content"></div>
      </div>
    </div>
    <!-- URL strip -->
    <div style="display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface2);border-top:1px solid var(--border);flex-shrink:0">
      <div id="M-url-output" style="flex:1;font-family:monospace;font-size:11px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.8">尚未生成...</div>
      <button class="tb-btn" onclick="generateAndCopy()" style="padding:7px 14px;font-size:12px;background:var(--accent);color:#0d1117;border-color:var(--accent)">⚡ 複製URL</button>
    </div>
  </div>

  <!-- PREVIEW PANEL -->
  <div class="mpanel" id="mp-preview">
    <div style="padding:10px 14px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <span style="font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim)">📱 即時預覽</span>
      <select id="M-pvsel" class="pv-sel" onchange="renderPreview()" style="min-height:36px;font-size:12px"></select>
    </div>
    <div style="flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px 16px;background:var(--bg)">
      <div class="phone-frame" style="width:min(280px,90%)">
        <div class="phone-notch"><div class="phone-notch-pill"></div></div>
        <div class="pv-titlebar" id="M-pvtitle">App</div>
        <div class="pv-body">
          <div class="pv-head" id="M-pvhead"></div>
          <div class="pv-desc" id="M-pvdesc"></div>
          <div id="M-pvfields"></div>
          <div id="M-pvbtns"></div>
        </div>
      </div>
    </div>
    <!-- Run button in preview -->
    <div style="padding:10px 14px;background:var(--surface2);border-top:1px solid var(--border);flex-shrink:0">
      <button class="tb-btn success" onclick="openRuntime()" style="width:100%;min-height:48px;font-size:14px;border-radius:12px">▶ 全螢幕運行</button>
    </div>
  </div>

  <!-- DIAGNOSTICS PANEL -->
  <div class="mpanel" id="mp-diag">
    <div style="display:flex;border-bottom:1px solid var(--border);background:var(--surface2);padding:0 6px;flex-shrink:0">
      <div class="dtab active" id="M-dtab-err" onclick="switchMDTab('err')">錯誤 <span class="badge" id="M-err-badge">0</span></div>
      <div class="dtab" id="M-dtab-warn" onclick="switchMDTab('warn')">警告 <span class="badge w" id="M-warn-badge">0</span></div>
      <div class="dtab" id="M-dtab-info" onclick="switchMDTab('info')">資訊 <span class="badge ok" id="M-info-badge">0</span></div>
    </div>
    <div id="M-diag-body" style="flex:1;overflow-y:auto;padding:6px 10px"></div>
    <!-- Scene actions -->
    <div style="padding:10px 12px;background:var(--surface2);border-top:1px solid var(--border);display:flex;gap:8px;flex-shrink:0">
      <button class="tb-btn" onclick="formatJSON()" style="flex:1;min-height:44px">⌗ 格式化</button>
      <button class="tb-btn" onclick="addScene()" style="flex:1;min-height:44px">＋ 新增場景</button>
      <button class="tb-btn" id="M-btn-undo" onclick="undo()" disabled style="min-height:44px;padding:8px 12px">↩</button>
    </div>
  </div>

</div>

<div id="statusbar"><span id="status-msg">就緒</span><span id="status-pos" style="flex-shrink:0;font-family:monospace">行1,列1</span></div>

<div id="bottom-bar">
  <div class="bottom-tabs">
    <button class="btab active" id="btab-editor" onclick="switchMTab('editor')"><span class="btab-icon">📄</span><span>編輯</span></button>
    <button class="btab" id="btab-preview" onclick="switchMTab('preview')"><span class="btab-icon">📱</span><span>預覽</span></button>
    <button class="btab" id="btab-diag" onclick="switchMTab('diag')"><span class="btab-icon">🔍</span><span id="diag-tab-label">診斷</span></button>
    <button class="btab" id="btab-scenes" onclick="toggleDrawer()"><span class="btab-icon">🗂️</span><span>場景</span></button>
  </div>
</div>

<!-- RUNTIME OVERLAY -->
<div id="runtime-overlay">
  <button class="rt-close" onclick="closeRuntime()">✕ 關閉</button>
  <div class="rt-phone">
    <div id="rt-title">App</div>

// AUDIO ENGINE
// ═══════════════════════════════════════════════════════
let audioCtx=null;
let bgmAudio=null;
let globalVolume=0.7;
let activeSpeech=null;
let activeRecog=null;

function getAudioCtx(){
  if(!audioCtx){audioCtx=new(window.AudioContext||window.webkitAudioContext)();}
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

// BGM
function bgm(url,vol){
  stopBGM();
  vol=vol!==undefined?vol:globalVolume;
  bgmAudio=new Audio();
  bgmAudio.src=url;
  bgmAudio.loop=true;
  bgmAudio.volume=vol;
  bgmAudio.crossOrigin='anonymous';
  bgmAudio.play().then(()=>{
    showAudioBar('bgm',true);
  }).catch(e=>{
    setStatus('BGM 播放失敗：'+e.message,'e');
    bgmAudio=null;
  });
}
function stopBGM(){
  if(bgmAudio){bgmAudio.pause();bgmAudio.src='';bgmAudio=null;showAudioBar('bgm',false);}
}
function pauseBGM(){
  if(!bgmAudio)return;
  if(bgmAudio.paused)bgmAudio.play();
  else bgmAudio.pause();
}

// SFX
function sfx(url,vol){
  vol=vol!==undefined?vol:globalVolume;
  const a=new Audio(url);
  a.volume=vol;
  a.crossOrigin='anonymous';
  a.play().catch(e=>setStatus('SFX 播放失敗','e'));
}

// BEEP (Web Audio API)
function beep(freq,ms,wave){
  try{
    const ctx=getAudioCtx();
    const osc=ctx.createOscillator();
    const gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type=wave||'sine';
    osc.frequency.setValueAtTime(freq||440,ctx.currentTime);
    gain.gain.setValueAtTime(globalVolume*0.3,ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(ms||300)/1000);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime+(ms||300)/1000+0.05);
  }catch(e){setStatus('Beep 失敗：'+e.message,'e');}
}

// TTS
function tts(text,lang){
  if(!window.speechSynthesis){setStatus('此瀏覽器不支援 TTS','e');return;}
  stopTTS();
  if(!text||!text.trim())return;
  const utt=new SpeechSynthesisUtterance(text);
  utt.lang=lang||'zh-TW';
  utt.volume=globalVolume;
  utt.onstart=()=>showAudioBar('tts',true);
  utt.onend=()=>showAudioBar('tts',false);
  utt.onerror=()=>showAudioBar('tts',false);
  activeSpeech=utt;
  window.speechSynthesis.speak(utt);
}
function stopTTS(){
  if(window.speechSynthesis)window.speechSynthesis.cancel();
  activeSpeech=null;showAudioBar('tts',false);
}

// STT
function stt(fieldName,lang){
  const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    setStatus('此瀏覽器不支援語音辨識（請用 Chrome）','e');
    alert('語音辨識需要 Chrome 瀏覽器。\n其他瀏覽器不支援 SpeechRecognition API。');
    return;
  }
  if(activeRecog){activeRecog.stop();activeRecog=null;showAudioBar('stt',false);return;}
  const recog=new SpeechRecognition();
  recog.lang=lang||'zh-TW';
  recog.interimResults=true;
  recog.maxAlternatives=1;
  recog.onstart=()=>{showAudioBar('stt',true);setStatus('🎤 收音中，請說話...','ok');};
  recog.onresult=(e)=>{
    const transcript=Array.from(e.results).map(r=>r[0].transcript).join('');
    // Fill runtime input
    const inputEl=document.getElementById('rt-input-'+fieldName);
    if(inputEl)inputEl.value=transcript;
    // Update rtState
    rtState[fieldName]=transcript;
    // Show interim in result field
    const resEl=document.getElementById('rt-stt-result-'+fieldName);
    if(resEl)resEl.textContent=transcript;
  };
  recog.onerror=(e)=>{setStatus('語音辨識錯誤：'+e.error,'e');showAudioBar('stt',false);activeRecog=null;};
  recog.onend=()=>{showAudioBar('stt',false);activeRecog=null;setStatus('語音辨識完成','ok');};
  activeRecog=recog;
  recog.start();
  activeRecog=recog;
}

// Parse audio commands from run string
function parseAndRunAudio(runStr){
  // Check for audio commands vs JS
  // Commands are now just JS function calls — eval handles everything
  try{ eval(runStr); }catch(e){ alert('執行錯誤: '+e.message); }
}

function setGlobalVolume(v){
  globalVolume=parseFloat(v);
  if(bgmAudio)bgmAudio.volume=globalVolume;
  // Sync both volume sliders
  ['ab-volume','rt-volume'].forEach(id=>{const el=document.getElementById(id);if(el)el.value=globalVolume;});
}

// AUDIO BAR UI
function showAudioBar(type,on){
  const ids={bgm:'ab-bgm-item',tts:'ab-tts-item',stt:'ab-stt-item'};
  const rtIds={bgm:'rt-ab-bgm',tts:'rt-ab-tts'};
  const el=document.getElementById(ids[type]);
  if(el)el.style.display=on?'flex':'none';
  const rtEl=rtIds[type]&&document.getElementById(rtIds[type]);
  if(rtEl)rtEl.style.display=on?'flex':'none';
  // Show rt audio bar if anything active
  const rtBar=document.getElementById('rt-audio-bar');
  if(rtBar){
    const anyActive=bgmAudio||activeSpeech||activeRecog;
    rtBar.classList.toggle('visible',!!anyActive);
  }
  // Show global audio bar
  const bar=document.getElementById('audio-bar');
  const anyVisible=['ab-bgm-item','ab-tts-item','ab-stt-item'].some(id=>{
    const el=document.getElementById(id);return el&&el.style.display!=='none';
  });
  bar.classList.toggle('visible',anyVisible);
  document.getElementById('app').classList.toggle('audio-bar-on',anyVisible);
  document.getElementById('mobile-panels').classList.toggle('audio-bar-on',anyVisible);
  const sb=document.getElementById('sidebar');
  if(sb)sb.classList.toggle('audio-bar-on',anyVisible);
}

let dTab='err',mTab='err',eTab='code',mETab='code',mMobTab='editor';
let sceneId=null,data=null,rtState={},timer=null;
let diagData={err:[],warn:[],info:[]};
const isMob=()=>window.innerWidth<=600;

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
function init(){
  const raw=new URLSearchParams(location.search).get('d');
  if(raw){
    ['app','toolbar','statusbar','bottom-bar','mobile-panels','audio-bar'].forEach(id=>{
      const el=document.getElementById(id);if(el)el.style.display='none';
    });
    const ov=document.getElementById('runtime-overlay');
    ov.classList.add('show');
    ov.style.padding='0';
    document.querySelector('.rt-close').style.display='';
    try{
      let b64=decodeURIComponent(raw).replace(/-/g,'+').replace(/_/g,'/');
      while(b64.length%4)b64+='=';
      const app=JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64),c=>c.charCodeAt(0))));
      rtState={};renderRuntime(Object.keys(app)[0],app);
    }catch{document.getElementById('rt-content').innerHTML='<div style="padding:20px;color:red">解析錯誤</div>';}
    return;
  }
  // Build ref panels
  document.getElementById('ref-content').innerHTML=buildRefHTML();
  document.getElementById('M-ref-content').innerHTML=buildRefHTML();
  // Default mobile tab to visual
  mETab='visual';
  loadExample('audio_demo');
  setupEvents('D-editor',false);
  setupEvents('M-editor',true);
}

// ═══════════════════════════════════════════════════════
// EDITOR EVENTS
// ═══════════════════════════════════════════════════════
function setupEvents(id,mobile){
  const ed=document.getElementById(id);
  ed.addEventListener('input',()=>{pushUndo(ed.value);schedule(mobile);});
  ed.addEventListener('keydown',e=>{
    if(e.key==='Tab'){e.preventDefault();const s=ed.selectionStart;ed.value=ed.value.slice(0,s)+'  '+ed.value.slice(ed.selectionEnd);ed.selectionStart=ed.selectionEnd=s+2;update(mobile);}
    if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();}
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key==='z'))){e.preventDefault();redo();}
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();genURL();setStatus('已儲存','ok');}
  });
  ed.addEventListener('keyup',updateCursor);ed.addEventListener('click',updateCursor);
  ed.addEventListener('scroll',()=>syncScroll(id,mobile));
}
function syncScroll(id,mobile){
  const ed=document.getElementById(id),pre=mobile?'M-':'D-';
  const hl=document.getElementById(pre+'hldisplay'),ln=document.getElementById(pre+'lnums');
  if(hl){hl.scrollTop=ed.scrollTop;hl.scrollLeft=ed.scrollLeft;}
  if(ln)ln.scrollTop=ed.scrollTop;
}

// ═══════════════════════════════════════════════════════
// UNDO / REDO
// ═══════════════════════════════════════════════════════
function pushUndo(v){if(v===lastPush)return;if(undoStack.length>50)undoStack.shift();undoStack.push(lastPush);redoStack=[];lastPush=v;updateUndoUI();}
function undo(){if(!undoStack.length)return;const p=undoStack.pop();redoStack.push(getVal());setVal(p);updateUndoUI();}
function redo(){if(!redoStack.length)return;const n=redoStack.pop();undoStack.push(getVal());setVal(n);updateUndoUI();}
function getVal(){return document.getElementById(isMob()?'M-editor':'D-editor').value;}
function setVal(v){['D-editor','M-editor'].forEach(id=>document.getElementById(id).value=v);lastPush=v;update();}
function updateUndoUI(){
  document.getElementById('btn-undo').disabled=!undoStack.length;
  document.getElementById('btn-redo').disabled=!redoStack.length;
  document.getElementById('undo-count').textContent=undoStack.length?`(${undoStack.length})`:'';
  // Mobile undo btn
  const mub=document.getElementById('M-btn-undo');
  if(mub)mub.disabled=!undoStack.length;
}

// ═══════════════════════════════════════════════════════
// UPDATE PIPELINE
// ═══════════════════════════════════════════════════════
function schedule(m){clearTimeout(timer);timer=setTimeout(()=>update(m),250);}
function update(fromMobile){
  const DE=document.getElementById('D-editor'),ME=document.getElementById('M-editor');
  if(fromMobile)DE.value=ME.value;else ME.value=DE.value;
  code=DE.value;
  updateHL('D-',code);updateHL('M-',code);
  const r=safeParse(code);
  runDiag(r);
  if(r.ok){data=r.data;updateScenes();updatePVSels();renderPreview();genURL(true);if(eTab==='visual')buildVPanel('D');if(mETab==='visual')buildVPanel('M');}
}
function updateCursor(){
  const ed=document.getElementById(isMob()?'M-editor':'D-editor');
  const t=ed.value.slice(0,ed.selectionStart);
  document.getElementById('status-pos').textContent=`行${t.split('\n').length},列${t.split('\n').pop().length+1}`;
}

// ═══════════════════════════════════════════════════════
// SYNTAX HIGHLIGHTING
// ═══════════════════════════════════════════════════════
function tok(code){
  return code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/("(?:[^"\\]|\\.)*")\s*(:)|("(?:[^"\\]|\\.)*")|(true|false|null)|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|([{}[\],:])/g,
    (m,k,c,s,b,n,p)=>{
      if(k&&c)return`<span style="color:var(--tok-key)">${k}</span>${c}`;
      if(s){
        // Highlight audio keywords inside strings
        const inner=s.slice(1,-1);
        const audioHL=inner.replace(/(bgm|sfx|beep|tts|stt)\s*\(/g,`<span style="color:var(--audio);font-weight:700">$1</span>(`);
        return`<span style="color:var(--tok-str)">"${audioHL}"</span>`;
      }
      if(b)return`<span style="color:var(--tok-bool)">${b}</span>`;
      if(n!==undefined)return`<span style="color:var(--tok-num)">${n}</span>`;
      if(p)return`<span style="color:var(--tok-punct)">${p}</span>`;
      return m;
    });
}
function updateHL(pre,code){
  const ln=code.split('\n').map((_,i)=>i+1).join('<br>');
  const hl=document.getElementById(pre+'hldisplay'),lnEl=document.getElementById(pre+'lnums');
  if(hl)hl.innerHTML=tok(code);if(lnEl)lnEl.innerHTML=ln;
}

// ═══════════════════════════════════════════════════════
// JSON UTILS
// ═══════════════════════════════════════════════════════
function safeParse(c){try{return{ok:true,data:JSON.parse(c)};}catch(e){return{ok:false,error:e};}}
function formatJSON(){const r=safeParse(getVal());if(!r.ok){setStatus('JSON錯誤','e');return;}pushUndo(getVal());setVal(JSON.stringify(r.data,null,2));setStatus('已格式化','ok');}
function minifyJSON(){const r=safeParse(getVal());if(!r.ok){setStatus('JSON錯誤','e');return;}pushUndo(getVal());setVal(JSON.stringify(r.data));setStatus('已壓縮','ok');}

// ═══════════════════════════════════════════════════════
// DIAGNOSTICS
// ═══════════════════════════════════════════════════════
function runDiag(r){
  diagData={err:[],warn:[],info:[]};
  if(!r.ok){
    const em=r.error.message;
    const lm=em.match(/line (\d+)/i),pm=em.match(/position (\d+)/i);
    let ln=lm?lm[1]:'?';
    if(pm&&ln==='?')ln=code.slice(0,parseInt(pm[1])).split('\n').length;
    diagData.err.push({msg:`JSON語法錯誤：${em}`,loc:`第${ln}行`,line:ln});
    setStatus(`✗ JSON錯誤 第${ln}行`,'e');
  }else{
    setStatus('✓ JSON有效','ok');
    const sc=Object.keys(r.data);
    let audioCount=0;
    sc.forEach(id=>{
      const s=r.data[id];
      (s.btns||[]).forEach(b=>{
        if(b.to&&!r.data[b.to])diagData.warn.push({msg:`按鈕「${b.label}」指向不存在的場景「${b.to}」`,loc:`場景:${id}`});
        if(b.run&&/bgm\(|sfx\(|beep\(|tts\(|stt\(/.test(b.run))audioCount++;
      });
      if(!s.btns||!s.btns.length)diagData.warn.push({msg:`場景「${id}」沒有按鈕`,loc:`場景:${id}`});
    });
    diagData.info.push({msg:`共${sc.length}個場景`,loc:sc.join(', ')});
    diagData.info.push({msg:`共${sc.reduce((a,id)=>a+(r.data[id].btns||[]).length,0)}個按鈕`,loc:''});
    if(audioCount>0)diagData.info.push({msg:`🎵 偵測到${audioCount}個音訊指令`,loc:'bgm / sfx / beep / tts / stt'});
  }
  updateBadges();renderDiag('D');renderDiag('M');
}
function updateBadges(){
  const e=diagData.err.length,w=diagData.warn.length,i=diagData.info.length;
  [['D-err-badge',e],['M-err-badge',e]].forEach(([id,n])=>{const el=document.getElementById(id);if(!el)return;el.textContent=n;el.className='badge'+(n?'':' ok');});
  [['D-warn-badge',w],['M-warn-badge',w]].forEach(([id,n])=>{const el=document.getElementById(id);if(!el)return;el.textContent=n;el.className='badge w';});
  [['D-info-badge',i],['M-info-badge',i]].forEach(([id,n])=>{const el=document.getElementById(id);if(!el)return;el.textContent=n;el.className='badge ok';});
  const dl=document.getElementById('diag-tab-label');
  if(dl)dl.textContent=diagData.err.length?`診斷(${diagData.err.length})`:diagData.warn.length?`診斷(${diagData.warn.length})`:'診斷';
}
function switchDTab(t){dTab=t;['err','warn','info'].forEach(x=>document.getElementById(`D-dtab-${x}`).classList.toggle('active',x===t));renderDiag('D');}
function switchMDTab(t){mTab=t;['err','warn','info'].forEach(x=>document.getElementById(`M-dtab-${x}`).classList.toggle('active',x===t));renderDiag('M');}
function renderDiag(pre){
  const tab=pre==='D'?dTab:mTab,items=diagData[tab]||[];
  const icons={err:'🔴',warn:'🟡',info:'🔵'},msgs={err:'沒有錯誤 ✓',warn:'沒有警告 ✓',info:'尚無資訊'};
  const el=document.getElementById(pre==='D'?'diag-body':'M-diag-body');if(!el)return;
  if(!items.length){el.innerHTML=`<div class="diag-empty">${msgs[tab]}</div>`;return;}
  el.innerHTML=items.map(it=>`<div class="diag-item" onclick="jumpToErr(${it.line||0})"><span class="diag-icon">${icons[tab]}</span><span class="diag-msg">${it.msg}${it.loc?`<div class="diag-loc">${it.loc}</div>`:''}</span></div>`).join('');
}
function jumpToErr(line){
  if(!line)return;
  const ed=document.getElementById(isMob()?'M-editor':'D-editor');
  const lines=ed.value.split('\n');let pos=0;
  for(let i=0;i<Math.min(line-1,lines.length);i++)pos+=lines[i].length+1;
  ed.focus();ed.setSelectionRange(pos,pos+(lines[line-1]||'').length);
}

// ═══════════════════════════════════════════════════════
// SCENES
// ═══════════════════════════════════════════════════════
function updateScenes(){
  if(!data)return;
  const scenes=Object.keys(data);
  if(!sceneId||!data[sceneId])sceneId=scenes[0];
  document.getElementById('scene-list').innerHTML=scenes.map(id=>`
    <div class="scene-item${id===sceneId?' active':''}" onclick="selScene('${id}');closeDrawer()">
      <span>📄 ${id}</span>
      <span class="scene-badge">${(data[id].btns||[]).length}b</span>
      <button class="scene-del" onclick="delScene('${id}',event)">×</button>
    </div>`).join('');
}
function selScene(id){
  sceneId=id;updateScenes();updatePVSels();
  ['D-pvsel','M-pvsel'].forEach(s=>{const el=document.getElementById(s);if(el)el.value=id;});
  renderPreview();if(eTab==='visual')buildVPanel('D');if(mETab==='visual')buildVPanel('M');
}
function addScene(){
  const r=safeParse(getVal());if(!r.ok){setStatus('請先修正JSON錯誤','e');return;}
  let nid='scene_'+(Object.keys(r.data).length+1);
  while(r.data[nid])nid+='_new';
  r.data[nid]={title:'新場景',head:'新場景標題',desc:'請輸入描述...',btns:[{label:'返回',to:Object.keys(r.data)[0]}]};
  pushUndo(getVal());setVal(JSON.stringify(r.data,null,2));selScene(nid);setStatus(`已新增場景「${nid}」`,'ok');
}
function delScene(id,e){
  e.stopPropagation();
  const r=safeParse(getVal());if(!r.ok)return;
  if(Object.keys(r.data).length<=1){setStatus('至少需要一個場景','e');return;}
  if(!confirm(`確定要刪除場景「${id}」嗎？`))return;
  delete r.data[id];pushUndo(getVal());sceneId=Object.keys(r.data)[0];setVal(JSON.stringify(r.data,null,2));setStatus(`已刪除場景「${id}」`,'ok');
}

// ═══════════════════════════════════════════════════════
// PREVIEW
// ═══════════════════════════════════════════════════════
function updatePVSels(){
  if(!data)return;
  const scenes=Object.keys(data);
  ['D-pvsel','M-pvsel'].forEach(selId=>{
    const el=document.getElementById(selId);if(!el)return;
    const cur=el.value;
    el.innerHTML=scenes.map(id=>`<option value="${id}">${id}</option>`).join('');
    el.value=scenes.includes(cur)?cur:scenes[0];
  });
}

function getAudioTags(runStr){
  if(!runStr)return'';
  const tags=[];
  if(/bgm\(/.test(runStr))tags.push('<span class="pv-audio-tag bgm">BGM</span>');
  if(/sfx\(/.test(runStr))tags.push('<span class="pv-audio-tag sfx">SFX</span>');
  if(/beep\(/.test(runStr))tags.push('<span class="pv-audio-tag beep">🎹</span>');
  if(/tts\(/.test(runStr))tags.push('<span class="pv-audio-tag tts">🗣️</span>');
  if(/stt\(/.test(runStr))tags.push('<span class="pv-audio-tag stt">🎤</span>');
  if(/showMap\(|geocodeSearch\(|locateMe\(/.test(runStr))tags.push('<span class="pv-audio-tag tts" style="background:#d1fae5;color:#065f46">🗺️</span>');
  if(/joinRoom\(/.test(runStr))tags.push('<span class="pv-audio-tag stt" style="background:#ede9fe;color:#5b21b6">📹</span>');
  return tags.join('');
}

function getSceneWidgetTags(scene){
  const tags=[];
  if(scene.map)tags.push('<span style="display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:#d1fae5;color:#065f46;margin:2px">🗺️ 地圖</span>');
  if(scene.room)tags.push('<span style="display:inline-block;font-size:9px;font-weight:700;padding:2px 6px;border-radius:4px;background:#ede9fe;color:#5b21b6;margin:2px">📹 '+(scene.room.mode==='host'?'建立':'加入')+'會議室</span>');
  return tags.join('');
}

function renderPreview(){
  if(!data)return;
  const dSel=document.getElementById(isMob()?'M-pvsel':'D-pvsel');
  const id=(dSel?dSel.value:null)||Object.keys(data)[0];
  const scene=data[id];if(!scene)return;
  [['D-pvtitle','D-pvhead','D-pvdesc','D-pvfields','D-pvbtns'],
   ['M-pvtitle','M-pvhead','M-pvdesc','M-pvfields','M-pvbtns']].forEach(([t,h,d,f,b])=>{
    const tEl=document.getElementById(t),hEl=document.getElementById(h),
          dEl=document.getElementById(d),fEl=document.getElementById(f),bEl=document.getElementById(b);
    if(tEl)tEl.textContent=(scene.title||id).toUpperCase();
    if(hEl)hEl.textContent=scene.head||'';
    if(dEl)dEl.textContent=scene.desc||'';
    if(fEl)fEl.innerHTML=(scene.fields||[]).map(f=>`<div class="pv-field-label">${f}</div><div class="pv-field-input">${f}...</div>`).join('');
    if(bEl)bEl.innerHTML=
      getSceneWidgetTags(scene)+
      (scene.btns||[]).map(btn=>`<div class="pv-btn" style="background:${btn.to?'#111':'#3b5bdb'}">${btn.label}${getAudioTags(btn.run)}</div>`).join('');
  });
}

// ═══════════════════════════════════════════════════════
// VISUAL PANEL
// ═══════════════════════════════════════════════════════
function switchETab(t){
  eTab=t;
  ['code','visual','ref'].forEach(x=>{
    document.getElementById(`etab-${x}`).classList.toggle('active',x===t);
    const p=document.getElementById(`panel-${x}`);
    if(p)p.style.display=x===t?(x==='code'?'block':'block'):'none';
  });
  if(t==='visual')buildVPanel('D');
}
function switchMETab(t){
  mETab=t;
  ['code','visual','ref'].forEach(x=>{
    const tab=document.getElementById(`M-etab-${x}`);
    if(tab)tab.classList.toggle('active',x===t);
    const p=document.getElementById(`M-panel-${x}`);
    if(p)p.style.display=x===t?'block':'none';
  });
  if(t==='visual'){
    document.getElementById('M-panel-visual').style.height='100%';
    document.getElementById('M-panel-visual').style.overflowY='auto';
    buildVPanel('M');
  }
}

// Audio chips for visual editor button actions
const AUDIO_CHIPS=`
<div class="audio-chips">
  <span style="font-size:10px;color:var(--text-dim);align-self:center">快速插入：</span>
  <button class="chip bgm" onclick="insertChip(this,'bgm')">🎵 bgm</button>
  <button class="chip sfx" onclick="insertChip(this,'sfx')">🔊 sfx</button>
  <button class="chip beep" onclick="insertChip(this,'beep')">🎹 beep</button>
  <button class="chip tts" onclick="insertChip(this,'tts')">🗣️ tts</button>
  <button class="chip stt" onclick="insertChip(this,'stt')">🎤 stt</button>
  <button class="chip map" onclick="insertChip(this,'map')">🗺️ map</button>
  <button class="chip room" onclick="insertChip(this,'room')">📹 room</button>
</div>`;
const CHIP_TEMPLATES={
  bgm:"bgm('https://your-music-url.mp3')",
  sfx:"sfx('https://your-sfx-url.mp3')",
  beep:"beep(440,300,'sine')",
  tts:"tts('你好！','zh-TW')",
  stt:"stt('欄位名稱','zh-TW')",
  map:"showMap(25.033,121.565,13)",
  room:"joinRoomById(rtState['房間 ID'])"
};
function insertChip(btn,type){
  // Find nearest vbtn-action input
  const item=btn.closest('.vbtn-item');
  if(!item)return;
  const input=item.querySelector('.vbtn-action');
  if(!input)return;
  const cur=input.value.trim();
  const tmpl=CHIP_TEMPLATES[type];
  if(cur&&!cur.startsWith('run:'))input.value='run:'+tmpl;
  else if(cur.startsWith('run:')){
    // Append with semicolon
    input.value=cur+';'+tmpl;
  }else{
    input.value='run:'+tmpl;
  }
}

function buildVPanel(pre){
  const panelId=pre==='D'?'D-vpanel':'M-vpanel';
  const el=document.getElementById(panelId);if(!el||!data)return;
  const scenes=Object.keys(data);
  const id=sceneId||scenes[0];
  const scene=data[id]||{};
  const p=pre.toLowerCase();
  const opts=scenes.map(s=>`<option value="${s}"${s===id?' selected':''}>${s}</option>`).join('');
  const btnItems=(scene.btns||[]).map((btn)=>`
    <div class="vbtn-item">
      <div class="vbtn-row">
        <div class="vfield" style="margin:0"><label style="font-size:9px">按鈕文字</label>
          <input class="vbtn-label" value="${esc(btn.label||'')}" placeholder="按鈕名稱">
        </div>
        <div class="vfield" style="margin:0"><label style="font-size:9px">動作 (to: / run:)</label>
          <input class="vbtn-action" value="${btn.to?'to:'+esc(btn.to):btn.run?'run:'+esc(btn.run):''}" placeholder="to:sceneId 或 run:js">
        </div>
        <button class="vbtn-del" onclick="this.closest('.vbtn-item').remove()">✕</button>
      </div>
      ${AUDIO_CHIPS}
    </div>`).join('');
  el.innerHTML=`
    <div style="margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:11px;font-weight:700;color:var(--text-dim)">場景：</span>
      <select onchange="selScene(this.value)" style="background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:5px;padding:6px 8px;font-size:12px;outline:none;min-height:36px">${opts}</select>
    </div>
    <div class="vfield-row">
      <div class="vfield"><label>場景 ID</label><input id="${p}-v-id" value="${esc(id)}"></div>
      <div class="vfield"><label>標題 (title)</label><input id="${p}-v-title" value="${esc(scene.title||'')}"></div>
    </div>
    <div class="vfield"><label>大標題 (head)</label><input id="${p}-v-head" value="${esc(scene.head||'')}"></div>
    <div class="vfield"><label>描述 (desc)</label><textarea id="${p}-v-desc">${scene.desc||''}</textarea></div>
    <div class="vfield"><label>欄位 (逗號分隔)</label><input id="${p}-v-fields" value="${(scene.fields||[]).join(', ')}"></div>
    <div class="vsection-title">按鈕 (btns)</div>
    <div id="${p}-btns-list">${btnItems}</div>
    <button class="vadd-btn" onclick="addVBtn('${p}')">＋ 新增按鈕</button>
    <button class="vapply" onclick="applyV('${p}')">✓ 套用變更</button>
  `;
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function addVBtn(p){
  const list=document.getElementById(`${p}-btns-list`);
  const div=document.createElement('div');div.className='vbtn-item';
  div.innerHTML=`<div class="vbtn-row"><div class="vfield" style="margin:0"><label style="font-size:9px">按鈕文字</label><input class="vbtn-label" placeholder="按鈕名稱"></div><div class="vfield" style="margin:0"><label style="font-size:9px">動作</label><input class="vbtn-action" placeholder="to:sceneId 或 run:js"></div><button class="vbtn-del" onclick="this.closest('.vbtn-item').remove()">✕</button></div>${AUDIO_CHIPS}`;
  list.appendChild(div);
}
function applyV(p){
  try{
    const r=safeParse(getVal());if(!r.ok){setStatus('JSON錯誤','e');return;}
    const d2=r.data,oldId=sceneId||Object.keys(d2)[0];
    const newId=(document.getElementById(`${p}-v-id`).value||oldId).trim();
    const sc=d2[oldId]||{};
    sc.title=document.getElementById(`${p}-v-title`).value;
    sc.head=document.getElementById(`${p}-v-head`).value;
    sc.desc=document.getElementById(`${p}-v-desc`).value;
    const fr=document.getElementById(`${p}-v-fields`).value;
    sc.fields=fr?fr.split(',').map(f=>f.trim()).filter(Boolean):[];
    const btns=[];
    document.querySelectorAll(`#${p}-btns-list .vbtn-item`).forEach(item=>{
      const label=item.querySelector('.vbtn-label').value.trim();
      const action=item.querySelector('.vbtn-action').value.trim();
      if(!label)return;
      const btn={label};
      if(action.startsWith('to:'))btn.to=action.slice(3).trim();
      else if(action.startsWith('run:'))btn.run=action.slice(4).trim();
      else if(action)btn.to=action;
      btns.push(btn);
    });
    sc.btns=btns;
    if(newId!==oldId)delete d2[oldId];
    d2[newId]=sc;
    pushUndo(getVal());setVal(JSON.stringify(d2,null,2));sceneId=newId;setStatus('✓ 已更新','ok');
  }catch{setStatus('更新失敗','e');}
}

// ═══════════════════════════════════════════════════════
// URL
// ═══════════════════════════════════════════════════════
function genURL(silent){
  const r=safeParse(getVal());
  if(!r.ok){if(!silent)setStatus('JSON錯誤','e');return null;}
  try{
    const b64=btoa(Array.from(new TextEncoder().encode(JSON.stringify(r.data)),b=>String.fromCharCode(b)).join(''));
    const url=location.origin+location.pathname+'?d='+encodeURIComponent(b64);
    ['url-output','M-url-output'].forEach(id=>{const el=document.getElementById(id);if(el)el.textContent=url;});
    window._url=url;return url;
  }catch{return null;}
}
function generateAndCopy(){const u=genURL();if(u)navigator.clipboard.writeText(u).then(()=>setStatus('✓ URL已複製！','ok'));}
function copyURL(){const u=window._url||genURL();if(!u){setStatus('請先生成URL','e');return;}navigator.clipboard.writeText(u).then(()=>setStatus('✓ 已複製','ok'));}

// ═══════════════════════════════════════════════════════
// RUNTIME
// ═══════════════════════════════════════════════════════
function openRuntime(){
  const r=safeParse(getVal());if(!r.ok){setStatus('JSON錯誤','e');return;}
  // Resume audio context on user gesture
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  rtState={};stopBGM();stopTTS();
  document.getElementById('runtime-overlay').classList.add('show');
  document.querySelector('.rt-close').style.display='';
  renderRuntime(Object.keys(r.data)[0],r.data);
}
function closeRuntime(){
  document.getElementById('runtime-overlay').classList.remove('show');
  stopBGM();stopTTS();if(activeRecog){activeRecog.stop();activeRecog=null;}
  showAudioBar('bgm',false);showAudioBar('tts',false);showAudioBar('stt',false);
  // Cleanup map
  if(_rtMap){try{_rtMap.remove();}catch{}finally{_rtMap=null;}}
  // Cleanup P2P
  leaveRoom();
}

function renderRuntime(pid,d){
  const page=d[pid];if(!page)return;
  document.getElementById('rt-title').textContent=(page.title||pid).toUpperCase();
  let h=page.head||'',desc=page.desc||'';
  Object.keys(rtState).forEach(k=>{const rx=new RegExp(`{{${k}}}`,'g');h=h.replace(rx,rtState[k]);desc=desc.replace(rx,rtState[k]);});
  
  const fields=(page.fields||[]).map(f=>`
    <div style="margin-bottom:12px">
      <div style="font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#999;margin-bottom:4px">${f}</div>
      <div style="display:flex;gap:6px;align-items:center">
        <input id="rt-input-${f}" value="${(rtState[f]||'').replace(/"/g,'&quot;')}" style="flex:1;padding:12px;background:#f5f5f5;border:1px solid #e5e5e5;border-radius:10px;font-size:14px;outline:none;min-height:48px">
      </div>
      <div class="stt-result" id="rt-stt-result-${f}"></div>
    </div>`).join('');

  const btns=(page.btns||[]).map(btn=>`
    <button class="rt-action-btn" onclick="rtClick(this)"
      data-to="${btn.to||''}"
      data-run="${encodeURIComponent(btn.run||'')}"
      data-fields='${JSON.stringify(page.fields||[])}'
    >${btn.label}${btn.run&&/tts\(/.test(btn.run)?'<span style="margin-left:6px;font-size:13px;opacity:.6">🗣️</span>':''}${btn.run&&/stt\(/.test(btn.run)?'<span style="margin-left:6px;font-size:13px;opacity:.6">🎤</span>':''}${btn.run&&/bgm\(/.test(btn.run)?'<span style="margin-left:6px;font-size:13px;opacity:.6">🎵</span>':''}${btn.run&&/beep\(/.test(btn.run)?'<span style="margin-left:6px;font-size:13px;opacity:.6">🎹</span>':''}${btn.run&&/showMap\(|locateMe\(|geocode/.test(btn.run)?'<span style="margin-left:6px;font-size:13px;opacity:.6">🗺️</span>':''}${btn.run&&/joinRoom\(/.test(btn.run)?'<span style="margin-left:6px;font-size:13px;opacity:.6">📹</span>':''}</button>`).join('');

  document.getElementById('rt-content').innerHTML=`
    <h2 style="font-size:22px;font-weight:900;color:#1a1a1a;margin-bottom:8px;line-height:1.2">${h}</h2>
    <p style="font-size:14px;color:#666;line-height:1.6;margin-bottom:18px;white-space:pre-line">${desc}</p>
    ${fields}
    <div style="margin-top:8px">${btns}</div>`;
  window._rtData=d;

  // Auto-play bgm if scene has it defined
  if(page.bgm)bgm(page.bgm);

  // Auto-render map widget if scene defines map config
  if(page.map){
    const mid='rt-map-'+Date.now();
    let extra=document.createElement('div');extra.id='rt-map-extra';
    extra.innerHTML=`
      <div class="rt-map-wrap">
        <div class="rt-map-toolbar">
          <input id="map-search-input" placeholder="搜尋地名..." style="flex:1">
          <button onclick="geocodeSearch(document.getElementById('map-search-input').value)">🔍</button>
          <button onclick="locateMe()">📍 定位</button>
        </div>
        <div id="${mid}" style="height:220px"></div>
      </div>`;
    document.getElementById('rt-content').appendChild(extra);
    renderMapWidget(page.map, mid);
  }

  // Auto-render room widget if scene defines room config
  if(page.room){
    renderRoomWidget(page.room);
  }
}

function rtClick(btn){
  // Resume AudioContext on user gesture
  if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  JSON.parse(btn.dataset.fields||'[]').forEach(f=>{const el=document.getElementById('rt-input-'+f);if(el)rtState[f]=el.value;});
  const to=btn.dataset.to,run=decodeURIComponent(btn.dataset.run);
  if(to)renderRuntime(to,window._rtData);
  if(run)parseAndRunAudio(run);
}

// ═══════════════════════════════════════════════════════
// MOBILE TABS / DRAWER / STATUS
// ═══════════════════════════════════════════════════════
function switchMTab(tab){
  mMobTab=tab;
  ['editor','preview','diag'].forEach(t=>{
    document.getElementById(`mp-${t}`).classList.toggle('active',t===tab);
    document.getElementById(`btab-${t}`).classList.toggle('active',t===tab);
  });
  document.getElementById('btab-scenes').classList.remove('active');
}
function toggleDrawer(){
  const sb=document.getElementById('sidebar'),ov=document.getElementById('drawer-overlay');
  if(sb.classList.contains('open')){sb.classList.remove('open');ov.style.opacity='0';setTimeout(()=>ov.style.display='none',250);}
  else{ov.style.display='block';requestAnimationFrame(()=>{ov.style.opacity='1';});sb.classList.add('open');}
}
function closeDrawer(){
  const sb=document.getElementById('sidebar'),ov=document.getElementById('drawer-overlay');
  sb.classList.remove('open');ov.style.opacity='0';setTimeout(()=>ov.style.display='none',250);
}
function setStatus(msg,type){
  const sb=document.getElementById('statusbar');
  document.getElementById('status-msg').textContent=msg;
  sb.className=type==='e'?'e':type==='w'?'w':'';
}
function loadExample(key){
